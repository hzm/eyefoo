<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>欢迎使用 EyeFoo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-body">
  <main class="settings-panel">
    <h1>欢迎使用 EyeFoo</h1>
    <p class="welcome-text">我已经开始运行，会定时提醒你休息眼睛。</p>
    <p class="welcome-text">我没有主窗口，住在屏幕右下角的<strong>系统托盘</strong>里（小图标）。右键图标可以暂停、立即休息或修改设置。</p>
    <p class="welcome-text">默认每工作 44 分钟提醒你休息一次，所有节奏都可以在「设置」里调整。</p>
    <button id="btn-got-it" class="settings-save">知道了</button>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
